    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=4" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Initial pre-React Windows 4-card-color splash loader */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 99999;
      }
      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background-color: #121331;
        }
      }
      .win-preloader {
        position: relative;
        width: 54px;
        height: 54px;
        animation: winPreRotate 2000ms ease-in-out infinite;
      }
      .win-pre-sq {
        position: absolute;
        width: 44%;
        height: 44%;
        border-radius: 4px;
        transform-origin: center;
        animation: winPreAnim 4000ms cubic-bezier(1, 0, 0, 1) infinite;
      }
      .win-pre-sq1 { background-color: #F5E6A3; }
      .win-pre-sq2 { background-color: #C9BDF5; animation-delay: -1000ms; }
      .win-pre-sq3 { background-color: #F2A89A; animation-delay: -2000ms; }
      .win-pre-sq4 { background-color: #A8D5B5; animation-delay: -3000ms; }

      @keyframes winPreAnim {
        0% { transform: translate(0, 0); }
        25% { transform: translate(125%, 0); }
        50% { transform: translate(125%, 125%); }
        75% { transform: translate(0, 125%); }
        100% { transform: translate(0, 0); }
      }
      @keyframes winPreRotate {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.72); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="win-preloader">
          <div class="win-pre-sq win-pre-sq1"></div>
          <div class="win-pre-sq win-pre-sq2"></div>
          <div class="win-pre-sq win-pre-sq3"></div>
          <div class="win-pre-sq win-pre-sq4"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
